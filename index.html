<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Committee Jeopardy</title>
<meta name="description" content="A clickable Jeopardy board for the Life Gurukula committee." />
<meta name="theme-color" content="#4292C6" />
<meta name="color-scheme" content="light" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --ocean: #4292C6;
    --ocean-deep: #23648F;
    --chandan: #FDF8EE;
    --chandan-deep: #F4E9D4;
    --paper: #FFFFFF;
    --ink: #211A12;
    --ink-soft: #574B3C;
    --saffron: #D9741A;
    --ochre: #8F4E0A;
    --kumkum: #8C1D2A;
    --tulsi: #2D5540;
    --water: #2E86B0;
    --hairline: color-mix(in srgb, var(--ochre) 30%, transparent);
    --radius: 12px;
    --shadow: 0 6px 16px rgba(14, 48, 70, .14);
    --shadow-lift: 0 12px 28px rgba(14, 48, 70, .24);
    /* height of the score strip, measured at runtime — the clue overlay
       stops just above it so scoring stays reachable mid-clue */
    --score-h: 96px;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--ocean);
    color: var(--ink);
    font: 400 18px/1.62 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { overflow-x: hidden; }

  /* paper grain, as on lifeseva.ca */
  .paper-grain {
    position: fixed;
    inset: 0;
    opacity: .05;
    pointer-events: none;
    z-index: 0;
  }
  .paper-grain svg { width: 100%; height: 100%; }

  /* the whole game fits one screen: header and score strip take what they
     need, the board stretches into the rest */
  .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 1220px;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top, 0px) + 20px)
      calc(env(safe-area-inset-right, 0px) + 20px)
      calc(env(safe-area-inset-bottom, 0px) + 16px)
      calc(env(safe-area-inset-left, 0px) + 20px);
  }

  /* ── Header ─────────────────────────────────────────────── */

  .hero { flex: none; text-align: center; }

  .eyebrow {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--chandan-deep);
    margin-bottom: 2px;
  }

  .hero h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(24px, 3.4vw, 38px);
    line-height: 1.1;
    margin: 0;
    color: var(--chandan);
  }

  /* ── Board ──────────────────────────────────────────────── */

  .board {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: 1fr;
    gap: 8px;
  }

  .category {
    background: var(--chandan-deep);
    border: 1px solid var(--hairline);
    border-top: 4px solid var(--accent, var(--saffron));
    border-radius: var(--radius);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(12px, 1.35vw, 18px);
    line-height: 1.2;
    color: var(--ochre);
  }

  .tile {
    font: inherit;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: clamp(17px, 2.4vw, 32px);
    color: var(--saffron);
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-left: 4px solid var(--accent, var(--saffron));
    border-radius: var(--radius);
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }

  .tile:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  .tile:active { transform: translateY(0) scale(.99); }
  .tile:focus-visible { outline: 3px solid var(--chandan); outline-offset: 2px; }

  .tile.used {
    background: color-mix(in srgb, var(--ocean-deep) 22%, transparent);
    border-color: color-mix(in srgb, var(--chandan) 30%, transparent);
    border-style: dashed;
    border-left-color: color-mix(in srgb, var(--chandan) 30%, transparent);
    color: transparent;
    box-shadow: none;
    cursor: default;
    transform: none;
  }

  /* ── Clue overlay ───────────────────────────────────────── */

  .overlay {
    position: fixed;
    inset: 0 0 var(--score-h);
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: color-mix(in srgb, var(--ocean) 92%, transparent);
    backdrop-filter: blur(6px);
  }

  .overlay.show { display: flex; }

  .clue-card {
    position: relative;
    width: min(880px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-left: 6px solid var(--accent, var(--saffron));
    border-radius: var(--radius);
    box-shadow: var(--shadow-lift);
    padding: clamp(24px, 4vw, 44px);
    text-align: center;
  }

  .clue-card .tag {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent, var(--saffron));
    margin-bottom: 16px;
  }

  .clue-card .clue {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(22px, 3.2vw, 36px);
    line-height: 1.35;
    color: var(--ink);
    margin: 0;
  }

  .clue-card .response {
    display: none;
    margin: 24px 0 0;
    padding-top: 22px;
    border-top: 1px solid var(--hairline);
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(21px, 3vw, 32px);
    color: var(--ochre);
  }

  .overlay.revealed .response { display: block; }

  /* ── Daily double ───────────────────────────────────────── */

  .dd-splash { display: none; }
  .overlay.wager .dd-splash { display: block; }
  .overlay.wager .clue,
  .overlay.wager .tag { display: none; }

  .dd-splash .dd-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: clamp(32px, 5vw, 54px);
    line-height: 1.1;
    color: var(--kumkum);
    margin: 0 0 8px;
  }

  .dd-splash .dd-sub {
    margin: 0 0 20px;
    font-size: 16px;
    color: var(--ink-soft);
  }

  .dd-splash label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .dd-splash input {
    width: 200px;
    max-width: 100%;
    padding: 12px 14px;
    font: inherit;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 22px;
    text-align: center;
    color: var(--ink);
    background: var(--chandan);
    border: 1px solid var(--hairline);
    border-radius: 10px;
  }

  .dd-splash input:focus {
    outline: 3px solid var(--saffron);
    outline-offset: 1px;
    background: var(--paper);
  }

  .tile.daily-double.used {
    border-left-color: var(--kumkum);
    border-left-style: solid;
  }

  /* ── Buttons ────────────────────────────────────────────── */

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 54px;
    margin-top: 24px;
    padding: 13px 20px;
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    color: var(--chandan);
    background: var(--saffron);
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background .12s ease, transform .12s ease;
  }

  .btn:hover { background: var(--ochre); }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }

  /* small pills, sitting directly on the blue */
  .pill {
    min-height: 34px;
    padding: 6px 13px;
    font: 600 13px 'Inter', sans-serif;
    color: var(--chandan);
    background: color-mix(in srgb, var(--ocean-deep) 55%, transparent);
    border: 1px solid color-mix(in srgb, var(--chandan) 40%, transparent);
    border-radius: 999px;
    cursor: pointer;
    transition: background .12s ease;
  }

  .pill:hover { background: var(--ocean-deep); }
  .pill:focus-visible { outline: 2px solid var(--chandan); outline-offset: 2px; }

  /* ── Score strip ────────────────────────────────────────── */

  .scorezone {
    flex: none;
    position: sticky;
    bottom: 0;
    z-index: 40;
    background: var(--ocean);
    padding-bottom: 2px;
  }

  .scorehead {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .awarding {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--chandan) 80%, transparent);
    margin-right: auto;
  }

  .awarding b {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 16px;
    letter-spacing: 0;
    color: var(--chandan);
  }

  .players {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .players:empty::after {
    content: "Add a player to keep score.";
    font-size: 13px;
    color: color-mix(in srgb, var(--chandan) 78%, transparent);
  }

  .player {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-left: 4px solid var(--water);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 5px 7px 5px 8px;
  }

  .player .who {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 74px;
  }

  .player input.name {
    width: 88px;
    padding: 0;
    font: 600 12px/1.25 'Inter', sans-serif;
    color: var(--ochre);
    background: none;
    border: 0;
    text-overflow: ellipsis;
  }

  .player input.name:focus { outline: 2px solid var(--saffron); outline-offset: 1px; border-radius: 3px; }

  .player .score {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: 19px;
    line-height: 1.15;
    color: var(--ink);
  }

  .player .score.neg { color: var(--kumkum); }

  .player .pm { display: flex; gap: 5px; }

  .player .pm button {
    width: 34px;
    height: 34px;
    padding: 0;
    font: 700 17px/1 'Inter', sans-serif;
    color: var(--chandan);
    background: var(--tulsi);
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .12s ease, opacity .12s ease;
  }

  .player .pm button.minus { background: var(--kumkum); }
  .player .pm button:active { transform: scale(.94); }
  .player .pm button:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
  .player .pm button[disabled] { opacity: .3; cursor: default; }

  .player .drop-player {
    width: 18px;
    height: 18px;
    padding: 0;
    font: 400 14px/1 'Inter', sans-serif;
    color: var(--ink-soft);
    background: none;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    opacity: .4;
    align-self: flex-start;
  }

  .player .drop-player:hover { opacity: 1; color: var(--kumkum); }

  /* short screens and phones: scroll rather than crush the board */
  @media (max-height: 560px), (max-width: 720px) {
    .wrap { min-height: 0; gap: 12px; padding-left: 14px; padding-right: 14px; }
    .board { grid-auto-rows: minmax(58px, 1fr); gap: 6px; }
    .scorezone { padding-top: 8px; border-top: 1px solid color-mix(in srgb, var(--chandan) 30%, transparent); }
    .players { flex-wrap: nowrap; overflow-x: auto; }
    .player { flex: 0 0 auto; }
  }
</style>
</head>
<body>

<div class="paper-grain" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" /></filter>
    <rect width="100%" height="100%" filter="url(#grain)" />
  </svg>
</div>

<div class="wrap">
  <header class="hero">
    <span class="eyebrow">Life Gurukula</span>
    <h1>Committee Jeopardy</h1>
  </header>

  <div class="board" id="board"></div>

  <div class="scorezone" id="scorezone">
    <div class="scorehead">
      <span class="awarding" id="awarding">Pick a clue to score</span>
      <button class="pill" id="add-player" type="button">+ Add player</button>
      <button class="pill" id="reset-scores" type="button">Reset scores</button>
      <button class="pill" id="reset" type="button">Reset board</button>
    </div>
    <div class="players" id="players"></div>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-clue">
  <div class="clue-card" id="clue-card">
    <div class="dd-splash">
      <p class="dd-title">Daily Double!</p>
      <p class="dd-sub">Set the wager, then reveal the clue.</p>
      <label for="wager">Wager</label>
      <input type="number" id="wager" step="100" min="0" />
    </div>
    <span class="tag" id="overlay-tag"></span>
    <p class="clue" id="overlay-clue"></p>
    <p class="response" id="overlay-response"></p>
    <button class="btn" id="overlay-action" type="button">Reveal response</button>
  </div>
</div>

<script>
  const categories = [
    {
      name: 'Thrills & Spills',
      accent: 'var(--saffron)',
      clues: [
        { value: 100, clue: "This member's family plays cricket at the professional level.", response: 'Who is Vivek?' },
        { value: 200, clue: 'This member has completed six marathons.', response: 'Who is Anuradha?' },
        { value: 300, clue: 'This member has hiked to the summit of Mount Kilimanjaro.', response: 'Who is Rajeshwar?' },
        { value: 400, clue: 'This member has reportedly weathered six concussions.', response: 'Who is Sumanji?' },
        { value: 500, clue: 'This member once spent the night sleeping in a postal vehicle.', response: 'Who is Vivekji?' }
      ]
    },
    {
      name: 'Rhythm & Style',
      accent: 'var(--kumkum)',
      clues: [
        { value: 100, clue: 'This member is a devoted fan of the K-pop group BTS.', response: 'Who is Priyanka?' },
        { value: 200, clue: 'This member plays the drums in a band.', response: 'Who is Pankajji?' },
        { value: 300, clue: 'This member dances Kuchipudi, a classical Indian form, at a professional level.', response: 'Who is Kamala?' },
        { value: 400, clue: 'Known to carry a boom box and sport a pink Rolex, this member has serious flair.', response: 'Who is Vivekji?' },
        { value: 500, clue: "This member posted a poem titled “The Sum of My Sins.”", response: 'Who is Saloni?' }
      ]
    },
    {
      name: 'One of a Kind',
      accent: 'var(--tulsi)',
      clues: [
        { value: 100, clue: 'This member is moving to India in April.', response: 'Who is Hemant?' },
        { value: 200, clue: 'This member is famous for never quite filling up the gas tank.', response: 'Who is Rajiv?' },
        { value: 300, clue: 'This member runs an organization called DIDI.', response: 'Who is Anuradha?' },
        { value: 400, clue: 'This member once cared for a cow — and once managed to lose it.', response: 'Who is Shankarji?' },
        { value: 500, clue: 'On a recent yatra this member picked up the nickname “the Principal.”', response: 'Who is Suhasini?' }
      ]
    },
    {
      name: 'Mark(ed) Your Calendar',
      accent: 'var(--ochre)',
      clues: [
        { value: 100, clue: 'The first-ever retreat at Life Gurukula was held on this date.', response: 'What is 10/02/25?' },
        { value: 200, clue: 'The keys to the property were handed over on this date.', response: 'What is 08/15/25?' },
        { value: 300, clue: 'The soft inauguration took place on this date.', response: 'What is 08/16/25?' },
        { value: 400, clue: 'The main inauguration is set for this date.', response: 'What is 11/15/25?' },
        { value: 500, clue: 'The commitment to Life Gurukula was made on this date.', response: 'What is 03/30/25?' }
      ]
    },
    {
      name: 'Life Gurukula History',
      accent: 'var(--water)',
      clues: [
        { value: 100, clue: 'The motherhouse and its two wings span this many square feet — enough to host up to 200 people at a retreat.', response: 'What is 58,000?' },
        { value: 200, clue: 'Mail sent to the property at 1230 W. Market St. lands in this five-digit Akron ZIP code.', response: 'What is 44313?' },
        { value: 300, clue: 'At its height the convent housed nearly this many sisters — a number that had dwindled to just 18 by the time it closed in 2024.', response: 'What is (nearly) 80?' },
        { value: 400, clue: 'The main building began as a mansion called Elm Court, built in this year for B.F. Goodrich executive Arthur Marks — more than a decade before the Sisters bought it.', response: 'What is 1912?' },
        { value: 500, clue: "Someone hoping to book a retreat at Life Gurukula's new Akron home would dial this 10-digit phone number.", response: 'What is (234) 334-0801?' }
      ]
    }
  ];

  const DAILY_DOUBLE_COUNT = 2;
  const STORE_KEY = 'lg-jeopardy-v2';

  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const clueCard = document.getElementById('clue-card');
  const overlayTag = document.getElementById('overlay-tag');
  const overlayClue = document.getElementById('overlay-clue');
  const overlayResponse = document.getElementById('overlay-response');
  const overlayAction = document.getElementById('overlay-action');
  const wagerInput = document.getElementById('wager');
  const scorezone = document.getElementById('scorezone');
  const playersEl = document.getElementById('players');
  const awardingEl = document.getElementById('awarding');

  /* state ------------------------------------------------------------- */

  let players = [];      // { id, name, score }
  let used = [];         // tile keys, e.g. "2-4"
  let doubles = [];      // tile keys drawn as daily doubles
  let activeTile = null;
  let award = null;      // points the +/- buttons currently apply

  const key = (col, row) => col + '-' + row;

  function drawDoubles() {
    // never on a $100 row, and at most one per category — as on the real board
    const pool = [];
    categories.forEach((cat, col) => {
      for (let row = 1; row < cat.clues.length; row++) pool.push({ col, row });
    });
    const picked = [];
    while (picked.length < DAILY_DOUBLE_COUNT && pool.length) {
      const i = Math.floor(Math.random() * pool.length);
      const cell = pool.splice(i, 1)[0];
      if (picked.some(p => p.col === cell.col)) continue;
      picked.push(cell);
    }
    return picked.map(p => key(p.col, p.row));
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ players, used, doubles }));
    } catch (e) { /* private mode / blocked storage — the game still works */ }
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.doubles) || !data.doubles.length) return false;
      players = Array.isArray(data.players) ? data.players : [];
      used = Array.isArray(data.used) ? data.used : [];
      doubles = data.doubles;
      return true;
    } catch (e) {
      return false;
    }
  }

  /* board -------------------------------------------------------------- */

  function buildBoard() {
    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + categories.length + ', 1fr)';

    categories.forEach(cat => {
      const header = document.createElement('div');
      header.className = 'category';
      header.style.setProperty('--accent', cat.accent);
      header.textContent = cat.name;
      board.appendChild(header);
    });

    for (let row = 0; row < 5; row++) {
      categories.forEach((cat, col) => {
        const item = cat.clues[row];
        const id = key(col, row);
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'tile';
        if (doubles.includes(id)) tile.classList.add('daily-double');
        if (used.includes(id)) tile.classList.add('used');
        tile.dataset.id = id;
        tile.style.setProperty('--accent', cat.accent);
        tile.textContent = '$' + item.value;
        tile.addEventListener('click', () => openClue(tile, cat, item, id));
        board.appendChild(tile);
      });
    }
  }

  function resetBoard() {
    used = [];
    doubles = drawDoubles();
    save();
    buildBoard();
  }

  /* clue flow ----------------------------------------------------------- */

  function openClue(tile, cat, item, id) {
    if (tile.classList.contains('used')) return;
    activeTile = tile;
    clueCard.style.setProperty('--accent', cat.accent);
    overlayTag.textContent = cat.name + ' — $' + item.value;
    overlayClue.textContent = item.clue;
    overlayResponse.textContent = item.response;
    overlay.classList.remove('revealed', 'wager');
    measureScorezone();

    if (doubles.includes(id)) {
      overlay.classList.add('wager');
      wagerInput.value = item.value;
      setAward(item.value);
      overlayAction.textContent = 'Reveal clue';
      overlay.classList.add('show');
      wagerInput.focus();
      wagerInput.select();
    } else {
      setAward(item.value);
      overlayAction.textContent = 'Reveal response';
      overlay.classList.add('show');
      overlayAction.focus();
    }
  }

  function advance() {
    if (overlay.classList.contains('wager')) {
      setAward(Math.max(0, Math.round(Number(wagerInput.value) || 0)));
      overlay.classList.remove('wager');
      overlayAction.textContent = 'Reveal response';
      overlayAction.focus();
      return;
    }
    if (!overlay.classList.contains('revealed')) {
      overlay.classList.add('revealed');
      overlayAction.textContent = 'Close';
      return;
    }
    closeClue();
  }

  function closeClue() {
    overlay.classList.remove('show', 'wager', 'revealed');
    if (activeTile) {
      activeTile.classList.add('used');
      const id = activeTile.dataset.id;
      if (!used.includes(id)) used.push(id);
      activeTile = null;
      save();
    }
    setAward(null);
  }

  overlayAction.addEventListener('click', advance);

  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeClue();
  });

  wagerInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); advance(); }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeClue();
  });

  /* scoring ------------------------------------------------------------- */

  function setAward(value) {
    award = value;
    awardingEl.innerHTML = value === null
      ? 'Pick a clue to score'
      : 'Awarding <b>$' + value.toLocaleString() + '</b>';
    playersEl.querySelectorAll('.pm button').forEach(b => { b.disabled = value === null; });
  }

  function renderPlayers() {
    playersEl.innerHTML = '';

    players.forEach(player => {
      const card = document.createElement('div');
      card.className = 'player';

      const who = document.createElement('div');
      who.className = 'who';

      const name = document.createElement('input');
      name.className = 'name';
      name.type = 'text';
      name.value = player.name;
      name.setAttribute('aria-label', 'Player name');
      name.addEventListener('input', () => { player.name = name.value; save(); });
      who.appendChild(name);

      const score = document.createElement('div');
      score.className = 'score';
      who.appendChild(score);
      card.appendChild(who);

      const pm = document.createElement('div');
      pm.className = 'pm';

      const minus = document.createElement('button');
      minus.className = 'minus';
      minus.type = 'button';
      minus.textContent = '−';
      minus.setAttribute('aria-label', 'Subtract from ' + player.name);

      const plus = document.createElement('button');
      plus.type = 'button';
      plus.textContent = '+';
      plus.setAttribute('aria-label', 'Add to ' + player.name);

      const paint = () => {
        score.textContent = (player.score < 0 ? '-$' : '$') + Math.abs(player.score).toLocaleString();
        score.classList.toggle('neg', player.score < 0);
      };

      const bump = sign => () => {
        if (award === null) return;
        player.score += sign * award;
        paint();
        save();
      };

      minus.addEventListener('click', bump(-1));
      plus.addEventListener('click', bump(1));

      pm.appendChild(minus);
      pm.appendChild(plus);
      card.appendChild(pm);

      const drop = document.createElement('button');
      drop.className = 'drop-player';
      drop.type = 'button';
      drop.textContent = '×';
      drop.title = 'Remove player';
      drop.setAttribute('aria-label', 'Remove ' + player.name);
      drop.addEventListener('click', () => {
        players = players.filter(p => p.id !== player.id);
        save();
        renderPlayers();
      });
      card.appendChild(drop);

      paint();
      playersEl.appendChild(card);
    });

    setAward(award);
    measureScorezone();
  }

  /* keep the overlay clear of the score strip, whatever height it grows to */
  function measureScorezone() {
    document.documentElement.style.setProperty('--score-h', scorezone.offsetHeight + 'px');
  }

  if (window.ResizeObserver) new ResizeObserver(measureScorezone).observe(scorezone);
  window.addEventListener('resize', measureScorezone);

  document.getElementById('add-player').addEventListener('click', () => {
    players.push({ id: Date.now() + '-' + players.length, name: 'Player ' + (players.length + 1), score: 0 });
    save();
    renderPlayers();
    const last = playersEl.lastElementChild;
    if (last) {
      const input = last.querySelector('input.name');
      input.focus();
      input.select();
    }
  });

  document.getElementById('reset').addEventListener('click', resetBoard);

  document.getElementById('reset-scores').addEventListener('click', () => {
    players.forEach(p => { p.score = 0; });
    save();
    renderPlayers();
  });

  /* boot ---------------------------------------------------------------- */

  if (!load()) doubles = drawDoubles();
  buildBoard();
  renderPlayers();
  measureScorezone();
  save();
</script>
</body>
</html>
