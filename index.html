<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Committee Jeopardy</title>
<meta name="description" content="A clickable Jeopardy board for the Life Gurukula committee — Our Lady of the Elms." />
<meta name="theme-color" content="#FDF8EE" />
<meta name="color-scheme" content="light" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --chandan: #FDF8EE;
    --chandan-deep: #F4E9D4;
    --paper: #FFFFFF;
    --ink: #211A12;
    --ink-soft: #574B3C;
    --saffron: #D9741A;
    --ochre: #8F4E0A;
    --kumkum: #8C1D2A;
    --tulsi: #2D5540;
    --water: #2E86B0;
    --hairline: color-mix(in srgb, var(--ochre) 30%, transparent);
    --radius: 12px;
    --shadow: 0 6px 16px rgba(33, 26, 18, .09);
    --shadow-lift: 0 12px 28px rgba(33, 26, 18, .16);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--chandan);
    color: var(--ink);
    font: 400 18px/1.62 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { overflow-x: hidden; }

  /* paper grain, as on lifeseva.ca */
  .paper-grain {
    position: fixed;
    inset: 0;
    opacity: .05;
    pointer-events: none;
    z-index: 0;
  }
  .paper-grain svg { width: 100%; height: 100%; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1120px;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top, 0px) + 40px)
      calc(env(safe-area-inset-right, 0px) + 24px)
      calc(env(safe-area-inset-bottom, 0px) + 56px)
      calc(env(safe-area-inset-left, 0px) + 24px);
  }

  /* ── Header ─────────────────────────────────────────────── */

  .hero { text-align: center; margin-bottom: 36px; }

  .eyebrow {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--saffron);
    margin-bottom: 8px;
  }

  .hero h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(34px, 5.5vw, 52px);
    line-height: 1.15;
    margin: 0;
    color: var(--ochre);
  }

  .hero p {
    max-width: 560px;
    margin: 10px auto 0;
    font-size: 17px;
    color: var(--ink-soft);
  }

  .hero::after {
    content: "";
    display: block;
    width: 80px;
    height: 4px;
    background: var(--saffron);
    margin: 22px auto 0;
  }

  /* ── Board ──────────────────────────────────────────────── */

  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }

  .category {
    background: var(--chandan-deep);
    border: 1px solid var(--hairline);
    border-top: 4px solid var(--accent, var(--saffron));
    border-radius: var(--radius);
    padding: 16px 12px;
    min-height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(13px, 1.5vw, 19px);
    line-height: 1.25;
    color: var(--ochre);
  }

  .tile {
    font: inherit;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: clamp(20px, 3vw, 34px);
    color: var(--saffron);
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-left: 4px solid var(--accent, var(--saffron));
    border-radius: var(--radius);
    min-height: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }

  .tile:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  .tile:active { transform: translateY(0) scale(.99); }
  .tile:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }

  .tile.used {
    background: var(--chandan-deep);
    border-style: dashed;
    border-left-color: var(--ink-soft);
    color: transparent;
    box-shadow: none;
    cursor: default;
    transform: none;
  }

  /* ── Clue overlay ───────────────────────────────────────── */

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    background: color-mix(in srgb, var(--chandan) 96%, transparent);
    backdrop-filter: blur(6px);
    cursor: pointer;
  }

  .overlay.show { display: flex; }

  .clue-card {
    position: relative;
    width: min(880px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-left: 6px solid var(--accent, var(--saffron));
    border-radius: var(--radius);
    box-shadow: var(--shadow-lift);
    padding: clamp(28px, 5vw, 48px);
    text-align: center;
  }

  .clue-card .tag {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent, var(--saffron));
    margin-bottom: 18px;
  }

  .clue-card .clue {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(22px, 3.4vw, 38px);
    line-height: 1.35;
    color: var(--ink);
    margin: 0;
  }

  .clue-card .response {
    display: none;
    margin: 28px 0 0;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(22px, 3.2vw, 34px);
    color: var(--ochre);
  }

  .overlay.revealed .response { display: block; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 56px;
    margin-top: 28px;
    padding: 14px 20px;
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    color: var(--chandan);
    background: var(--saffron);
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background .12s ease, transform .12s ease;
  }

  .btn:hover { background: var(--ochre); }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }

  .btn-quiet {
    width: auto;
    margin: 36px auto 0;
    padding: 14px 26px;
    color: var(--ochre);
    background: var(--paper);
    border-color: var(--hairline);
    box-shadow: none;
  }

  .btn-quiet:hover { background: var(--chandan-deep); }

  @media (max-width: 720px) {
    html, body { font-size: 17px; }
    .wrap { padding-left: 16px; padding-right: 16px; }
    .board { gap: 6px; }
    .category { min-height: 66px; padding: 10px 6px; }
    .tile { min-height: 62px; border-left-width: 3px; }
  }
</style>
</head>
<body>

<div class="paper-grain" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" /></filter>
    <rect width="100%" height="100%" filter="url(#grain)" />
  </svg>
</div>

<div class="wrap">
  <header class="hero">
    <span class="eyebrow">Life Gurukula &middot; Our Lady of the Elms</span>
    <h1>Committee Jeopardy</h1>
    <p>Pick a value, read the clue, and answer in the form of a question.</p>
  </header>

  <div class="board" id="board"></div>

  <button class="btn btn-quiet" id="reset" type="button">Reset board</button>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-clue">
  <div class="clue-card" id="clue-card">
    <span class="tag" id="overlay-tag"></span>
    <p class="clue" id="overlay-clue"></p>
    <p class="response" id="overlay-response"></p>
    <button class="btn" id="overlay-action" type="button">Reveal response</button>
  </div>
</div>

<script>
  const categories = [
    {
      name: 'Thrills & Spills',
      accent: 'var(--saffron)',
      clues: [
        { value: 100, clue: "This member's family plays cricket at the professional level.", response: 'Who is Vivek?' },
        { value: 200, clue: 'This member has completed six marathons.', response: 'Who is Anuradha?' },
        { value: 300, clue: 'This member has hiked to the summit of Mount Kilimanjaro.', response: 'Who is Rajeshwar?' },
        { value: 400, clue: 'This member has reportedly weathered six concussions.', response: 'Who is Suman?' },
        { value: 500, clue: 'This member once spent the night sleeping in a postal vehicle.', response: 'Who is Vivekji?' }
      ]
    },
    {
      name: 'Rhythm & Style',
      accent: 'var(--kumkum)',
      clues: [
        { value: 100, clue: 'This member is a devoted fan of the K-pop group BTS.', response: 'Who is Priyanka?' },
        { value: 200, clue: 'This member plays the drums in a band.', response: 'Who is Pankajji?' },
        { value: 300, clue: 'This member is trained in Kuchipudi, a classical Indian dance form.', response: 'Who is Kamala?' },
        { value: 400, clue: 'Known to carry a boom box and sport a pink Rolex, this member has serious flair.', response: 'Who is Vivekji?' },
        { value: 500, clue: "This member is associated with the phrase “the sum of my sins.”", response: 'Who is Saloni?' }
      ]
    },
    {
      name: 'One of a Kind',
      accent: 'var(--tulsi)',
      clues: [
        { value: 100, clue: 'This member is moving to India in April.', response: 'Who is Hemant?' },
        { value: 200, clue: 'This member is famous for never quite filling up the gas tank.', response: 'Who is Rajiv?' },
        { value: 300, clue: "This member goes by the affectionate nickname “Didi.”", response: 'Who is Anuradha?' },
        { value: 400, clue: 'This member once cared for a cow.', response: 'Who is Shankarji?' },
        { value: 500, clue: 'This member is a principal at the World Bank.', response: 'Who is Suhasini?' }
      ]
    },
    {
      name: 'Mark Your Calendar',
      accent: 'var(--ochre)',
      clues: [
        { value: 100, clue: 'The first-ever retreat at Life Gurukula was held on this date.', response: 'What is 10/02/25?' },
        { value: 200, clue: 'The keys to the property were handed over on this date.', response: 'What is 08/15/25?' },
        { value: 300, clue: 'The pooja inauguration took place on this date.', response: 'What is 08/16/25?' },
        { value: 400, clue: 'The grand inauguration is set for this date.', response: 'What is 11/15/25?' },
        { value: 500, clue: 'The Gurukula commitment was made on this date.', response: 'What is 03/30/25?' }
      ]
    },
    {
      name: 'Our Lady of the Elms',
      accent: 'var(--water)',
      clues: [
        { value: 100, clue: 'The motherhouse and its two wings span this many square feet — enough to host up to 200 people at a retreat.', response: 'What is 58,000?' },
        { value: 200, clue: 'Mail sent to the property at 1230 W. Market St. lands in this five-digit Akron ZIP code.', response: 'What is 44313?' },
        { value: 300, clue: 'At its height the convent housed nearly this many sisters — a number that had dwindled to just 18 by the time it closed in 2024.', response: 'What is (nearly) 80?' },
        { value: 400, clue: 'The main building began as a mansion called Elm Court, built in this year for B.F. Goodrich executive Arthur Marks — more than a decade before the Sisters bought it.', response: 'What is 1912?' },
        { value: 500, clue: "Someone hoping to book a retreat at Life Gurukula's new Akron home would dial this 10-digit phone number.", response: 'What is (234) 334-0801?' }
      ]
    }
  ];

  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const clueCard = document.getElementById('clue-card');
  const overlayTag = document.getElementById('overlay-tag');
  const overlayClue = document.getElementById('overlay-clue');
  const overlayResponse = document.getElementById('overlay-response');
  const overlayAction = document.getElementById('overlay-action');

  let activeTile = null;

  function buildBoard() {
    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + categories.length + ', 1fr)';

    categories.forEach(cat => {
      const header = document.createElement('div');
      header.className = 'category';
      header.style.setProperty('--accent', cat.accent);
      header.textContent = cat.name;
      board.appendChild(header);
    });

    for (let row = 0; row < 5; row++) {
      categories.forEach(cat => {
        const item = cat.clues[row];
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'tile';
        tile.style.setProperty('--accent', cat.accent);
        tile.textContent = '$' + item.value;
        tile.addEventListener('click', () => openClue(tile, cat, item));
        board.appendChild(tile);
      });
    }
  }

  function openClue(tile, cat, item) {
    if (tile.classList.contains('used')) return;
    activeTile = tile;
    clueCard.style.setProperty('--accent', cat.accent);
    overlayTag.textContent = cat.name + ' — $' + item.value;
    overlayClue.textContent = item.clue;
    overlayResponse.textContent = item.response;
    overlay.classList.remove('revealed');
    overlayAction.textContent = 'Reveal response';
    overlay.classList.add('show');
    overlayAction.focus();
  }

  function advance() {
    if (!overlay.classList.contains('revealed')) {
      overlay.classList.add('revealed');
      overlayAction.textContent = 'Close';
      return;
    }
    closeClue();
  }

  function closeClue() {
    overlay.classList.remove('show');
    if (activeTile) {
      activeTile.classList.add('used');
      activeTile = null;
    }
  }

  overlay.addEventListener('click', advance);

  document.addEventListener('keydown', e => {
    if (!overlay.classList.contains('show')) return;
    if (e.key === 'Escape') closeClue();
  });

  document.getElementById('reset').addEventListener('click', buildBoard);

  buildBoard();
</script>
</body>
</html>
