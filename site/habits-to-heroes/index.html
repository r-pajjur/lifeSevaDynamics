<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habits to Heroes Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#2b1a63;
    --board-deep:#1c1046;
    --tile:#4938ac;
    --tile-hi:#6350c9;
    --gold:#ffcf33;
    --coral:#ff6b9d;
    --mint:#39d9a0;
    --ink:#1c1046;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(circle at 50% -10%, #3a2585 0%, #201252 55%, #160c3a 100%);
    color:#fff;min-height:100vh;padding:22px 16px 40px;
  }
  .wrap{max-width:1200px;margin:0 auto;}
  header{text-align:center;margin-bottom:20px;}
  h1{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:clamp(30px,6vw,58px);line-height:1;
    color:var(--gold);letter-spacing:1px;
    text-shadow:0 3px 0 #b8860b, 0 6px 14px rgba(0,0,0,.4);
  }
  h1 span{display:block;font-size:.42em;color:#fff;letter-spacing:4px;
    text-shadow:none;margin-top:8px;font-weight:500;text-transform:uppercase;}
  .board{
    display:grid;grid-template-columns:repeat(5,1fr);
    gap:8px;background:var(--board-deep);
    padding:8px;border-radius:16px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  .cat{
    background:var(--board-deep);color:#fff;
    font-family:'Fredoka',sans-serif;font-weight:600;
    font-size:clamp(12px,1.5vw,18px);text-transform:uppercase;
    letter-spacing:.5px;text-align:center;line-height:1.15;
    min-height:64px;display:flex;align-items:center;justify-content:center;
    padding:8px 6px;border-radius:10px;
  }
  .tile{
    background:var(--tile);border:none;color:var(--gold);
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:clamp(20px,3vw,40px);
    min-height:clamp(64px,11vh,104px);border-radius:12px;cursor:pointer;
    transition:transform .08s, background .15s;
    display:flex;align-items:center;justify-content:center;
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  .tile:hover:not(.done){background:var(--tile-hi);transform:translateY(-3px);}
  .tile:active:not(.done){transform:translateY(0);}
  .tile.done{background:#241a4d;color:#5b4f8c;cursor:default;font-size:26px;text-shadow:none;}
  .tile:focus-visible{outline:4px solid var(--coral);outline-offset:2px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(12,7,32,.9);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:10;
  }
  .overlay.show{display:flex;}
  .card{
    background:linear-gradient(160deg,#4938ac,#2b1a63);
    border:4px solid var(--gold);border-radius:22px;
    max-width:820px;width:100%;padding:36px 32px 30px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .card .badge{
    display:inline-block;background:var(--gold);color:var(--ink);
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;
    padding:4px 20px;border-radius:999px;margin-bottom:22px;
  }
  .card .clabel{font-size:14px;letter-spacing:2px;text-transform:uppercase;
    color:#c9bff0;margin-bottom:10px;font-weight:700;}
  .clue{font-size:clamp(22px,3.4vw,34px);font-weight:700;line-height:1.35;
    min-height:1.2em;}
  .answer{
    margin-top:26px;font-size:clamp(20px,3vw,30px);font-weight:800;
    color:var(--ink);background:var(--mint);border-radius:14px;
    padding:16px 20px;display:none;
  }
  .answer.show{display:block;}
  .answer .alabel{display:block;font-size:14px;letter-spacing:2px;
    text-transform:uppercase;color:#0c5c40;margin-bottom:6px;font-weight:700;}
  .btns{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;
    padding:12px 26px;border:none;border-radius:999px;cursor:pointer;color:#fff;
  }
  .btn-reveal{background:var(--mint);color:var(--ink);}
  .btn-close{background:var(--coral);}
  .btn:focus-visible{outline:4px solid #fff;outline-offset:2px;}
  .btn:hover{filter:brightness(1.08);}

  /* Scoreboard */
  .scores{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px auto 0;}
  .team{background:var(--board-deep);border-radius:14px;padding:12px 16px;min-width:150px;text-align:center;}
  .team input{
    background:transparent;border:none;border-bottom:2px dashed #6350c9;
    color:var(--gold);font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;
    text-align:center;width:100%;padding:2px;margin-bottom:6px;
  }
  .team input:focus{outline:none;border-bottom-color:var(--gold);}
  .team .pts{font-family:'Fredoka',sans-serif;font-weight:700;font-size:34px;color:#fff;line-height:1;}
  .team .row{display:flex;gap:6px;justify-content:center;margin-top:8px;}
  .team button{
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;
    width:40px;height:34px;border:none;border-radius:8px;cursor:pointer;color:#fff;
  }
  .plus{background:var(--mint);color:var(--ink);}
  .minus{background:var(--coral);}
  .team button:focus-visible{outline:3px solid #fff;outline-offset:2px;}
  .toolbar{text-align:center;margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .reset{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;
    background:transparent;color:#c9bff0;border:2px solid #6350c9;
    padding:10px 22px;border-radius:999px;cursor:pointer;
  }
  .reset:hover{background:#6350c9;color:#fff;}
  .feud-launch{
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;
    background:var(--gold);color:var(--ink);border:none;
    padding:12px 24px;border-radius:999px;cursor:pointer;
  }
  .feud-launch:hover{filter:brightness(1.05);}

  /* Family Feud */
  .feud-overlay{
    position:fixed;inset:0;background:rgba(8,5,24,.94);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:20;
  }
  .feud-overlay.show{display:flex;}
  .feud-card{
    background:linear-gradient(160deg,#243a9c,#141a52);
    border:5px solid var(--gold);border-radius:24px;
    max-width:900px;width:100%;padding:26px 28px 24px;text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.65);
  }
  .feud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .feud-counter{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:#bcd0ff;letter-spacing:1px;text-transform:uppercase;}
  .feud-counter b{color:var(--gold);}
  .strikes{display:flex;gap:8px;}
  .strike{
    width:40px;height:40px;border-radius:8px;border:2px solid #4a5db8;
    background:transparent;color:var(--coral);font-family:'Fredoka',sans-serif;
    font-weight:700;font-size:26px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .strike .x{visibility:hidden;}
  .strike.on{border-color:var(--coral);background:rgba(255,107,157,.15);}
  .strike.on .x{visibility:visible;}
  .feud-badge{
    display:inline-block;background:var(--gold);color:var(--ink);
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:15px;
    padding:3px 16px;border-radius:999px;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;
  }
  .feud-q{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(20px,3.2vw,30px);line-height:1.3;margin-bottom:18px;}
  .feud-slots{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .slot{
    display:flex;align-items:center;justify-content:space-between;
    background:#0f1445;border:2px solid #3a4aa0;border-radius:12px;
    min-height:52px;padding:0 6px 0 0;cursor:pointer;overflow:hidden;
  }
  .slot:hover:not(.open){border-color:var(--gold);}
  .slot .rank{
    width:52px;align-self:stretch;display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;
    background:#1b237a;color:var(--gold);
  }
  .slot .ans{
    flex:1;text-align:left;padding:0 14px;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(15px,2.2vw,21px);
    color:#fff;visibility:hidden;text-transform:uppercase;letter-spacing:.5px;
  }
  .slot .pts{
    min-width:56px;height:38px;margin-right:4px;border-radius:8px;
    background:var(--gold);color:var(--ink);
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;
    display:flex;align-items:center;justify-content:center;visibility:hidden;
  }
  .slot.open{background:#243a9c;border-color:var(--gold);}
  .slot.open .ans,.slot.open .pts{visibility:visible;}
  .slot.open .rank{background:#243a9c;color:#7d8ce0;}
  .feud-nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .feud-nav button{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;
    padding:11px 22px;border:none;border-radius:999px;cursor:pointer;color:#fff;
  }
  .fnav{background:#3a4aa0;}
  .fnav:hover{background:#4a5db8;}
  .fclose{background:var(--coral);}
  .feud-nav button:focus-visible{outline:3px solid #fff;outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Habits to Heroes<span>Classroom Jeopardy</span></h1>
  </header>

  <div class="board" id="board" role="grid" aria-label="Jeopardy game board"></div>

  <div class="scores" id="scores"></div>

  <div class="toolbar">
    <button class="reset" id="reset">Reset board</button>
    <button class="feud-launch" id="feudLaunch">Bonus round: Family Feud</button>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="clueText">
  <div class="card">
    <span class="badge" id="badge">$100</span>
    <p class="clabel" id="catLabel">Category</p>
    <p class="clue" id="clueText"></p>
    <div class="answer" id="answerBox">
      <span class="alabel">Answer</span>
      <span id="answerText"></span>
    </div>
    <div class="btns">
      <button class="btn btn-reveal" id="revealBtn">Show answer</button>
      <button class="btn btn-close" id="closeBtn">Close</button>
    </div>
  </div>
</div>

<div class="feud-overlay" id="feudOverlay" role="dialog" aria-modal="true" aria-labelledby="feudQ">
  <div class="feud-card">
    <div class="feud-top">
      <span class="feud-counter">Question <b id="fqNum">1</b> of 5</span>
      <div class="strikes" id="strikes"></div>
    </div>
    <span class="feud-badge">Survey says...</span>
    <p class="feud-q" id="feudQ"></p>
    <div class="feud-slots" id="feudSlots"></div>
    <div class="feud-nav">
      <button class="fnav" id="fPrev">&larr; Previous</button>
      <button class="fnav" id="fNext">Next &rarr;</button>
      <button class="fclose" id="fClose">Close</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  { cat:"Good Habits", cells:[
    {v:100, c:"Doing this to your teeth for two minutes, twice a day, keeps cavities away.", a:"Brushing your teeth"},
    {v:200, c:"Making one of these the night before helps you get ready faster in the morning.", a:"A checklist or plan (like packing your backpack or laying out clothes)"},
    {v:300, c:"Scientists say doing something over and over for about this many days helps it become a habit: 2, 20, or 200?", a:"About 20 days"},
    {v:400, c:"This habit before bed can make it harder to fall asleep, so experts say turn them off early.", a:"Using devices or screens (phones, tablets, TV)"},
    {v:500, c:"A \u201Ckeystone habit\u201D is one good habit that leads to MORE good ones. Name 3 keystone habits that help kids do better in school.", a:"Exercise, reading, or getting enough sleep (accept any good answer)"}
  ]},
  { cat:"Being Kind", cells:[
    {v:100, c:"How do you show respect when speaking to someone?", a:"Make eye contact, don't interrupt, listen, etc."},
    {v:200, c:"Understanding how someone else feels, like imagining you're in their shoes, is called this.", a:"Empathy"},
    {v:300, c:"Instead of just watching someone get bullied, an \u201Cupstander\u201D does this.", a:"Steps in, speaks up, or gets help"},
    {v:400, c:"What does it mean to forgive someone?", a:"When a friend says sorry for a mistake, choosing to let it go instead of staying mad is called this."},
    {v:500, c:"Being kind even when no one is watching shows you have this quality that starts with \u201CC.\u201D", a:"Character (accept \u201Cintegrity\u201D)"}
  ]},
  { cat:"Healthy Hero", cells:[
    {v:100, c:"Eating a \u201Crainbow\u201D of these foods gives your body different vitamins.", a:"Fruits and vegetables"},
    {v:200, c:"This clear, sugar-free drink is the best choice to keep your body and brain working well.", a:"Water"},
    {v:300, c:"Your heart is a muscle. This kind of activity, like running or biking, makes it stronger.", a:"Exercise (cardio / aerobic activity)"},
    {v:400, c:"Doctors say kids should get about this much active play every day: 15 minutes, 60 minutes, or 4 hours?", a:"60 minutes (1 hour)"},
    {v:500, c:"Foods with lots of added sugar give you quick energy, but then this \u201CC\u201D happens to your energy soon after.", a:"A crash (your energy drops)"}
  ]},
  { cat:"Everyday Heroes", cells:[
    {v:100, c:"These helpers rush toward danger to put out fires and rescue people.", a:"Firefighters"},
    {v:200, c:"This \u201Ceveryday hero\u201D works at your school and helps you learn something new every day.", a:"A teacher"},
    {v:300, c:"\u201CFirst responders\u201D arrive first in an emergency. Name one type of first responder.", a:"Police officer, firefighter, or paramedic/EMT (accept any)"},
    {v:400, c:"This kind of hero volunteers their time to help others without getting paid, like at an ashram or animal shelter.", a:"A volunteer"},
    {v:500, c:"A real-life hero doesn't need superpowers. Name one thing that makes someone a hero in everyday life.", a:"Being brave, kind, helping others, standing up for what's right (accept any good answer)"}
  ]},
  { cat:"Never Give Up", cells:[
    {v:100, c:"Instead of \u201CI can't do it,\u201D add this powerful 3-letter word: \u201CI can't do it ___.\u201D", a:"Yet"},
    {v:200, c:"When you make a mistake, it's really a chance to do this.", a:"Learn"},
    {v:300, c:"Trying again and again until you succeed \u2014 this \u201CP\u201D word.", a:"Perseverance (or persistence)"},
    {v:400, c:"This inventor failed many times before he made the light bulb work.", a:"Thomas Edison"},
    {v:500, c:"Doing something over and over until it becomes automatic builds one of these.", a:"A (good) habit"}
  ]}
];

const FEUD = [
  { q:"Name a chore kids can do to help out at home.", answers:[
    {t:"Clean your room / make your bed", p:28},
    {t:"Do the dishes", p:22},
    {t:"Take out the trash", p:19},
    {t:"Feed a pet", p:16},
    {t:"Set the table", p:15}
  ]},
  { q:"Name a place where you might see a hero helping people.", answers:[
    {t:"Hospital", p:26},
    {t:"Fire station", p:23},
    {t:"School", p:20},
    {t:"Police station", p:17},
    {t:"Their neighborhood / a park", p:14}
  ]},
  { q:"Name something that makes a good friend.", answers:[
    {t:"Being nice / kind", p:30},
    {t:"Sharing", p:21},
    {t:"Listening to you", p:19},
    {t:"Being honest / trustworthy", p:16},
    {t:"Being funny / fun to be with", p:14}
  ]},
  { q:"Name something you should do before you go to bed.", answers:[
    {t:"Brush your teeth", p:31},
    {t:"Put on pajamas", p:22},
    {t:"Read a book", p:18},
    {t:"Pack your backpack for tomorrow", p:16},
    {t:"Say goodnight", p:13}
  ]},
  { q:"Name a way you can be brave.", answers:[
    {t:"Trying something new", p:27},
    {t:"Standing up for someone", p:24},
    {t:"Speaking in front of the class", p:19},
    {t:"Telling the truth", p:17},
    {t:"Asking for help", p:13}
  ]}
];

const board = document.getElementById('board');
const overlay = document.getElementById('overlay');
const badge = document.getElementById('badge');
const catLabel = document.getElementById('catLabel');
const clueText = document.getElementById('clueText');
const answerBox = document.getElementById('answerBox');
const answerText = document.getElementById('answerText');
const revealBtn = document.getElementById('revealBtn');
let lastTile = null;

function buildBoard(){
  board.innerHTML = '';
  DATA.forEach(col=>{
    const h = document.createElement('div');
    h.className = 'cat';
    h.textContent = col.cat;
    board.appendChild(h);
  });
  for(let r=0;r<5;r++){
    DATA.forEach((col)=>{
      const cell = col.cells[r];
      const b = document.createElement('button');
      b.className = 'tile';
      b.textContent = '$' + cell.v;
      b.addEventListener('click', ()=>openClue(col.cat, cell, b));
      board.appendChild(b);
    });
  }
}

function openClue(cat, cell, tile){
  if(tile.classList.contains('done')) return;
  lastTile = tile;
  badge.textContent = '$' + cell.v;
  catLabel.textContent = cat;
  clueText.textContent = cell.c;
  answerText.textContent = cell.a;
  answerBox.classList.remove('show');
  revealBtn.style.display = '';
  overlay.classList.add('show');
  revealBtn.focus();
}

revealBtn.addEventListener('click', ()=>{
  answerBox.classList.add('show');
  revealBtn.style.display = 'none';
});

function closeModal(){
  overlay.classList.remove('show');
  if(lastTile){
    lastTile.classList.add('done');
    lastTile.textContent = '\u2713';
  }
}
document.getElementById('closeBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && overlay.classList.contains('show')) closeModal(); });

/* Scoreboard */
const scores = document.getElementById('scores');
const TEAMS = ['Team 1','Team 2','Team 3'];
function buildScores(){
  scores.innerHTML = '';
  TEAMS.forEach((name)=>{
    const wrap = document.createElement('div');
    wrap.className = 'team';
    wrap.innerHTML =
      '<input value="'+name+'" aria-label="Team name">' +
      '<div class="pts">0</div>' +
      '<div class="row">' +
        '<button class="minus" aria-label="Subtract 100">\u2212</button>' +
        '<button class="plus" aria-label="Add 100">+</button>' +
      '</div>';
    const pts = wrap.querySelector('.pts');
    wrap.querySelector('.plus').addEventListener('click', ()=>{ pts.textContent = (+pts.textContent + 100); });
    wrap.querySelector('.minus').addEventListener('click', ()=>{ pts.textContent = (+pts.textContent - 100); });
    scores.appendChild(wrap);
  });
}

document.getElementById('reset').addEventListener('click', ()=>{
  buildBoard();
  scores.querySelectorAll('.pts').forEach(p=>p.textContent='0');
});

/* Family Feud */
const feudOverlay = document.getElementById('feudOverlay');
const feudQ = document.getElementById('feudQ');
const feudSlots = document.getElementById('feudSlots');
const fqNum = document.getElementById('fqNum');
const strikesBox = document.getElementById('strikes');
let fIndex = 0;

function buildStrikes(){
  strikesBox.innerHTML = '';
  for(let i=0;i<3;i++){
    const s = document.createElement('button');
    s.className = 'strike';
    s.setAttribute('aria-label','Strike '+(i+1));
    s.innerHTML = '<span class="x">\u2718</span>';
    s.addEventListener('click', ()=> s.classList.toggle('on'));
    strikesBox.appendChild(s);
  }
}

function renderFeud(){
  const round = FEUD[fIndex];
  fqNum.textContent = fIndex + 1;
  feudQ.textContent = round.q;
  feudSlots.innerHTML = '';
  round.answers.forEach((ans, i)=>{
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.setAttribute('role','button');
    slot.setAttribute('tabindex','0');
    slot.innerHTML =
      '<div class="rank">'+(i+1)+'</div>' +
      '<div class="ans">'+ans.t+'</div>' +
      '<div class="pts">'+ans.p+'</div>';
    const flip = ()=> slot.classList.add('open');
    slot.addEventListener('click', flip);
    slot.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); }});
    feudSlots.appendChild(slot);
  });
  buildStrikes();
}

document.getElementById('feudLaunch').addEventListener('click', ()=>{
  fIndex = 0;
  renderFeud();
  feudOverlay.classList.add('show');
});
document.getElementById('fPrev').addEventListener('click', ()=>{
  fIndex = (fIndex - 1 + FEUD.length) % FEUD.length;
  renderFeud();
});
document.getElementById('fNext').addEventListener('click', ()=>{
  fIndex = (fIndex + 1) % FEUD.length;
  renderFeud();
});
document.getElementById('fClose').addEventListener('click', ()=> feudOverlay.classList.remove('show'));
feudOverlay.addEventListener('click', e=>{ if(e.target===feudOverlay) feudOverlay.classList.remove('show'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && feudOverlay.classList.contains('show')) feudOverlay.classList.remove('show'); });

buildBoard();
buildScores();
</script>
</body>
</html>
